<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>BnB Route Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>BnB Route Tracker</h1>
    <div class="header-sub">Tournées réelles · Import GPS</div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- View: Journée (import Traccar + exercice manuel) -->
  <div id="view-track" class="view active">
    <div id="track-content"></div>
  </div>

  <!-- View: Addresses -->
  <div id="view-addresses" class="view">
    <div id="address-list" class="address-list"></div>
  </div>

  <!-- View: History -->
  <div id="view-history" class="view">
    <div id="history-list"></div>
  </div>

  <!-- View: Planner -->
  <div id="view-plan" class="view">
    <div id="plan-content"></div>
  </div>

  <!-- View: Settings -->
  <div id="view-settings" class="view">
    <div id="settings-content"></div>
  </div>

  <!-- FAB -->
  <button id="fab-add" class="fab" style="display:none">+</button>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12,6 12,12 16,14"/>
      </svg>
      Journée
    </button>
    <button class="nav-btn" data-view="addresses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Adresses
    </button>
    <button class="nav-btn" data-view="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 2v6m0 0H3m6 0h12M3 8v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8"/>
        <path d="M9 16l2 2 4-4"/>
      </svg>
      Planifier
    </button>
    <button class="nav-btn" data-view="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/>
        <path d="M7 16l4-8 4 4 4-6"/>
      </svg>
      Historique
    </button>
    <button class="nav-btn" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Réglages
    </button>
  </nav>

  <!-- Écran d'accès -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-box">
      <img src="icon-192.png" alt="" width="72" height="72" class="lock-icon">
      <h2>BnB Route Tracker</h2>
      <p>Mot de passe d'accès</p>
      <input id="lock-password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Mot de passe">
      <div id="lock-status" class="lock-status"></div>
      <button id="lock-submit" class="btn btn-primary">Ouvrir</button>
    </div>
  </div>

  <!-- Modal (logement ou correction d'étape) -->
  <div id="address-modal" class="modal-overlay">
    <div class="modal" id="modal-body" style="max-height:88vh;overflow-y:auto"></div>
  </div>

  <script src="app-main.js" type="module"></script>
</body>
</html>
